<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glamoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; bright gradient hero, illustrated service tiles, bottom tab bar, sticky action bar in the booking flow. */
:root{
  --bg:#FFF4FA; --surface:#FFFFFF; --ink:#2A1236; --muted:#7A6A85; --line:#F1DCEA;
  --g1:#6A2BD9; --g2:#E0338D; --g3:#FF8A3D;
  --accent:#B01E7C; --accent-soft:#FCE4F2; --accent-ink:#FFFFFF;
  --ok:#14804F; --ok-soft:#D9F5E7; --warn:#8A5200; --warn-soft:#FFEBC7; --bad:#C0261E;
  --shadow:0 2px 4px rgba(106,43,217,.06),0 10px 24px rgba(224,51,141,.10);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150C1E; --surface:#221530; --ink:#F6EBFA; --muted:#B7A3C4; --line:#3A2650;
  --accent:#FF8FC8; --accent-soft:#3B1D45; --accent-ink:#2A1124;
  --ok:#6CCBA3; --ok-soft:#1D3A30; --warn:#F0BE6B; --warn-soft:#3F3015; --bad:#FF8A80;
  --shadow:0 2px 4px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#150C1E; --surface:#221530; --ink:#F6EBFA; --muted:#B7A3C4; --line:#3A2650;
  --accent:#FF8FC8; --accent-soft:#3B1D45; --accent-ink:#2A1124;
  --ok:#6CCBA3; --ok-soft:#1D3A30; --warn:#F0BE6B; --warn-soft:#3F3015; --bad:#FF8A80;
  --shadow:0 2px 4px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 130px;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin-inline:auto;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:700} h3{font-size:16px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding-block:14px 10px;min-width:0}
.top h2{flex:1;min-width:0}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow)}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h3{font-size:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
/* illustrations */
.art{border-radius:16px;display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}
.art.thumb{width:80px;height:80px}
.art.wide{width:100%;height:98px;border-radius:0}
.art.tile{width:100%;height:96px;border-radius:0}
.art.mini{width:52px;height:52px;border-radius:14px}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(125deg,var(--g1) 0%,var(--g2) 62%,var(--g3) 118%);color:#fff;border-radius:24px;padding:18px;min-height:196px;box-shadow:0 14px 30px rgba(224,51,141,.28)}
.hero .txt{position:relative;max-width:66%;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hero .side{position:absolute;right:-10px;bottom:-14px;width:150px;height:150px}
.hero .side svg{width:100%;height:100%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.hero .code{border:1.5px dashed rgba(255,255,255,.9);border-radius:10px;padding:5px 12px;font-weight:700;letter-spacing:.12em;background:rgba(255,255,255,.16);color:#fff}
.hero .kick{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero h2{font-size:24px;font-weight:800}
/* banners */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin-inline:-2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.banner{flex:none;width:78%;max-width:300px;scroll-snap-align:start;border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-height:112px;text-align:left;border:0}
.banner b{font-family:var(--display);font-size:19px;line-height:1.1}
.banner .cd{align-self:flex-start;border:1.5px dashed rgba(255,255,255,.9);border-radius:8px;padding:2px 10px;font-weight:700;letter-spacing:.1em;background:rgba(255,255,255,.16)}
.banner::after{content:"";position:absolute;right:-24px;top:-24px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.18)}
.pcard{flex:none;width:162px;scroll-snap-align:start;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.pbody{padding:10px;display:flex;flex-direction:column;gap:6px}
.pbody .t{font-weight:700;line-height:1.2;min-height:2.4em}
/* category tiles */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat-tile{border:1px solid var(--line);padding:0;border-radius:18px;overflow:hidden;background:var(--surface);text-align:left;box-shadow:var(--shadow);min-width:0}
.cat-tile .nm{padding:9px 12px 11px;display:block}
.cat-tile b{display:block;font-family:var(--display);font-size:16px}
/* stylists */
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.person{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:0}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 6px 14px rgba(0,0,0,.18);border:3px solid var(--surface)}
.av.sm{width:46px;height:46px;font-size:18px;box-shadow:none}
.person b{font-size:13px;line-height:1.15}
.person span{font-size:11px;color:var(--muted);line-height:1.2}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.perk{border-radius:14px;padding:10px;color:#fff;font-weight:700;font-size:13px;line-height:1.2;min-height:62px;display:flex;align-items:flex-end}
/* controls */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--g1),var(--g2))}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;width:100%;box-shadow:0 8px 18px rgba(224,51,141,.25)}
.btn.alt{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn.sm{width:auto;padding:8px 16px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.link{display:block;text-align:center;text-decoration:none}
.btn.wa{background:linear-gradient(135deg,#128C4B,#25D366);color:#fff}
input[type=text],input[type=tel],input[type=search],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500}
.svc{display:flex;gap:12px;align-items:center}
.svc .t{font-weight:700;line-height:1.2}
.price{font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent)}
.tag.cat{color:#fff}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--warn-soft);color:var(--bad)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day,.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 4px;text-align:center;font-weight:700}
.day small{display:block;color:var(--muted);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day[aria-pressed="true"],.slot[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
.day[aria-pressed="true"] small{color:inherit}
.slot[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed;background:var(--bg)}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--g2);background:var(--accent-soft)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"] .dot{border:6px solid var(--g2)}
.pb{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;letter-spacing:.04em}
.bill{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bill.total{font-weight:800;font-size:18px;border-top:1px dashed var(--line);padding-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -8px 24px rgba(106,43,217,.08)}
.bar .in{max-width:460px;margin-inline:auto;display:flex;gap:12px;align-items:center}
.bar.up{bottom:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:10px;border-radius:18px 18px 0 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav .in{max-width:460px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .pill{padding:3px 18px;border-radius:999px;display:grid;place-items:center}
.nav [aria-current="page"] .pill{background:var(--accent-soft)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--g1),var(--g2))}
.stepnames{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:28px;padding:0;color:var(--line);line-height:1}
.stars button.on{color:#F5A400}
.hbar{height:11px;border-radius:6px;min-width:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:16px;padding:11px;color:#fff}
.tile b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.tile span{opacity:.9}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:500;z-index:20;max-width:90vw}
.err{color:var(--bad);font-size:13px}
details{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px}
summary{font-weight:700;cursor:pointer}
.done-top{position:relative;text-align:center;padding-top:34px}
.done-top svg.conf{position:absolute;left:0;right:0;top:0;width:100%;height:90px}
.tick{width:76px;height:76px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:linear-gradient(135deg,#14B87A,#6EE7B7);box-shadow:0 10px 24px rgba(20,184,122,.35);position:relative}
.tick svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.profile-av{width:64px;height:64px;font-size:26px}
@media (prefers-reduced-motion:no-preference){.card,.hero,.pcard,.cat-tile{animation:rise .3s ease-out}@keyframes rise{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}.tick{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}}
</style>
<style>html{color-scheme:light}body{margin:0}</style>

<script>

// Sample sales so the owner view shows a realistic summary. Replace with real orders once the salon uses the app.
const SAMPLE=[['s1',1],['s1',1],['s2',2],['s5',2],['s11',3],['s12',3],['s1',4],['s8',4],['s7',5],['s3',5],['s1',6],['s5',6],['s14',6],['s9',7],['s2',7],['s16',7],['s1',8],['s12',8]];

/* ---------- illustrations (inline SVG, no external images) ---------- */
function glyph(k,c){
  const w='#fff';
  switch(k){
  case 'scissors':return `<g fill="none" stroke="${w}" stroke-width="6" stroke-linecap="round"><circle cx="30" cy="74" r="10"/><circle cx="70" cy="74" r="10"/><path d="M37 66L68 24M63 66L32 24"/></g>`;
  case 'drop':return `<path d="M50 14C50 14 24 46 24 62a26 26 0 0 0 52 0C76 46 50 14 50 14z" fill="${w}"/><path d="M38 64a12 12 0 0 0 12 12" fill="none" stroke="${c[0]}" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>`;

  case 'wave':return `<g fill="none" stroke="${w}" stroke-width="6" stroke-linecap="round"><path d="M22 20c14 10-14 20 0 30s-14 20 0 30"/><path d="M50 20c14 10-14 20 0 30s-14 20 0 30"/><path d="M78 20c14 10-14 20 0 30s-14 20 0 30"/></g>`;
  case 'face':return `<ellipse cx="50" cy="52" rx="26" ry="32" fill="${w}"/><circle cx="36" cy="58" r="5" fill="#FF6F91" opacity=".45"/><circle cx="64" cy="58" r="5" fill="#FF6F91" opacity=".45"/><path d="M37 47q5 5 10 0M53 47q5 5 10 0M42 66q8 7 16 0" stroke="${c[0]}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  case 'sun':return `<circle cx="50" cy="50" r="17" fill="${w}"/><g stroke="${w}" stroke-width="6" stroke-linecap="round"><path d="M50 12v12M50 76v12M12 50h12M76 50h12M23 23l8 8M69 69l8 8M77 23l-8 8M31 69l-8 8"/></g>`;
  case 'gem':return `<path d="M30 30h40l16 20-36 36L14 50z" fill="${w}"/><path d="M14 50h72M38 30l12 56 12-56" stroke="${c[0]}" stroke-opacity=".4" stroke-width="3" fill="none"/>`;
  case 'stones':return `<ellipse cx="50" cy="74" rx="30" ry="11" fill="${w}"/><ellipse cx="50" cy="52" rx="22" ry="9" fill="${w}" opacity=".92"/><ellipse cx="50" cy="34" rx="14" ry="7" fill="${w}" opacity=".85"/>`;
  case 'lotus':return `<g fill="${w}"><ellipse cx="50" cy="50" rx="12" ry="28"/><ellipse cx="50" cy="50" rx="12" ry="28" transform="rotate(-48 50 78)" opacity=".9"/><ellipse cx="50" cy="50" rx="12" ry="28" transform="rotate(48 50 78)" opacity=".9"/></g><ellipse cx="50" cy="84" rx="30" ry="5" fill="${w}" opacity=".6"/>`;
  case 'leaf':return `<path d="M24 76C20 36 50 18 80 22 82 52 62 80 24 76z" fill="${w}"/><path d="M26 74C42 54 54 42 70 32" stroke="${c[0]}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  case 'polish':return `<rect x="32" y="46" width="36" height="36" rx="10" fill="${w}"/><rect x="43" y="34" width="14" height="14" fill="${w}" opacity=".9"/><rect x="40" y="12" width="20" height="24" rx="6" fill="${w}" opacity=".8"/><rect x="40" y="58" width="20" height="10" rx="5" fill="${c[0]}" opacity=".35"/>`;

function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function slotTaken(iso,t){
  if(S.bookings.some(b=>b.date===iso&&b.slot===t&&b.status!=='Cancelled'))return true;
  const now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  if(iso===today&&parseInt(t)<=now.getHours())return true;
  return hash(iso+t)%4===0;
}

}

function refCode(){return S.user?'GLAMOO-'+S.user.name.replace(/[^a-z]/gi,'').slice(0,4).toUpperCase()+S.user.phone.slice(-2):''}
function vProfile(){
  if(!S.user)return `${head('Profile')}<div class="stack"><div class="card stack"><b>Log in to see your bookings and points</b><p class="muted small" style="margin:0">Takes 20 seconds. No password needed.</p><button class="btn" data-act="loginGo">Log in</button></div>
   ${faq()}<button class="btn line" data-act="go" data-v="admin">Owner view (demo)</button></div>${nav()}`;
  const done=S.bookings.filter(b=>b.status==='Completed').length;
  return `${head('Profile')}<div class="stack">
  <div class="hero" style="min-height:0"><div class="row"><div class="av profile-av" style="background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6)">${esc(S.user.name[0].toUpperCase())}</div><div class="grow"><h2>${esc(S.user.name)}</h2><div class="small" style="opacity:.9">+91 ${esc(S.user.phone)}</div></div></div>
   <div class="row" style="margin-top:14px"><span class="code" style="font-size:15px">${S.user.points} points</span><span class="small" style="opacity:.95">${S.bookings.length} bookings · ${done} completed</span></div></div>
  <div class="muted small">Earn 1 point for every ₹10 spent once a service is completed.</div>
  <div class="card stack"><b>Referral code</b><div class="row between"><span class="price" style="letter-spacing:.08em">${refCode()}</span><button class="btn alt sm" data-act="share">Copy</button></div></div>
  ${faq()}
  <button class="btn line" data-act="go" data-v="admin">Owner view (demo)</button>
  <button class="btn line" data-act="logout">Log out</button>
  <button class="btn line" data-act="erase">Delete my data</button></div>${nav()}`;
}
function faq(){
  return `<div class="stack"><div class="label">Help</div>
  <details><summary>Can I change my time?</summary><p class="small muted">Cancel from My bookings up to 4 hours before and book a new slot.</p></details>
  <details><summary>Is my payment safe?</summary><p class="small muted">Card and UPI payments go through an RBI-compliant gateway. This app never stores card numbers or UPI PINs.</p></details>
  <details><summary>How do loyalty points work?</summary><p class="small muted">You get 1 point per ₹10 once a service is completed. Use them at checkout, up to 30% of the bill.</p></details>
  <details><summary>What data do you keep?</summary><p class="small muted">Your name, phone number and bookings, only to run your appointments (DPDP Act 2023). Delete them any time from Profile.</p></details></div>`;
}
function vAdmin(){
  const rows=SAMPLE.map(([id,d])=>({id,amt:svc(id).price}))
    .concat(S.bookings.filter(b=>b.status!=='Cancelled').flatMap(b=>b.items.map(i=>({id:i,amt:svc(i).price}))));
  const rev=rows.reduce((a,r)=>a+r.amt,0),cnt={};rows.forEach(r=>cnt[r.id]=(cnt[r.id]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0][1];
  const live=S.bookings.slice().reverse();
  return `${head('Owner view','profile')}<div class="stack">
  <div class="card small muted">Demo screen. The figures mix ${SAMPLE.length} sample services with any bookings made in this app.</div>
  <div class="tiles"><div class="tile" style="background:linear-gradient(135deg,#7B2FF7,#F107A3)"><span class="small">Revenue</span><b>${inr(rev)}</b></div><div class="tile" style="background:linear-gradient(135deg,#0B7A75,#3DD6A0)"><span class="small">Services</span><b>${rows.length}</b></div><div class="tile" style="background:linear-gradient(135deg,#D9480F,#FFB347)"><span class="small">Avg ticket</span><b>${inr(Math.round(rev/rows.length))}</b></div></div>
  <div class="card stack"><div class="label">Top services</div>${top.map(([id,n])=>{const s=svc(id),c=CAT[s.cat];return `<div class="row">${sArt(s,'mini')}<div class="grow"><div class="row between small"><span>${esc(s.name)}</span><b>${n}</b></div><div class="hbar" style="width:${Math.round(n/mx*100)}%;background:linear-gradient(90deg,${c[0]},${c[1]})"></div></div></div>`}).join('')}</div>
  <div class="card stack"><div class="label">Appointments from this app</div>${live.length?live.map(b=>`<div class="row between"><div class="grow"><b>${esc(b.id)}</b> · ${esc(b.name)}<div class="muted small">${dLabel(b.date)}, ${t12(b.slot)} · ${b.status}</div></div>${b.status!=='Completed'&&b.status!=='Cancelled'?`<button class="btn alt sm" data-act="advance" data-id="${b.id}">Next</button>`:''}</div>`).join(''):'<div class="muted small">No bookings from this app yet. Make one as a customer, then update its status here.</div>'}</div></div>`;
}

function render(){
  const v={home:vHome,services:vServices,book:vBook,login:vLogin,checkout:vCheckout,done:vDone,bookings:vBookings,profile:vProfile,admin:vAdmin}[S.view]||vHome;
  $('#app').innerHTML=v();
}
function refreshList(){const l=$('#list');if(l)l.innerHTML=svcList()}

const A={
 go:d=>go(d.v),
 cat:d=>{S.cat=d.c;S.q='';go('services')},
 toggle:d=>{const i=S.cart.indexOf(d.id);i>=0?S.cart.splice(i,1):S.cart.push(d.id);const y=scrollY;render();scrollTo(0,y)},
 stylist:d=>{S.stylist=d.id;const y=scrollY;render();scrollTo(0,y)},
 date:d=>{S.date=d.d;if(S.slot&&slotTaken(S.date,S.slot))S.slot=null;const y=scrollY;render();scrollTo(0,y)},
 slot:d=>{S.slot=d.t;const y=scrollY;render();scrollTo(0,y)},
 toCheckout:()=>{if(!S.user){S.after='checkout';S.otpSent=false;S.otp='';go('login')}else go('checkout')},
 consent:(d,el)=>{S.consent=el.checked},
 sendOtp:()=>{
  if(S.name.trim().length<2)return fail('Enter your name.');
  if(!/^[6-9]\d{9}$/.test(S.phone))return fail('Enter a valid 10-digit Indian mobile number.');
  if(!S.consent)return fail('Please accept the privacy notice to continue.');
  S.otpSent=true;S.err='';render();toast('OTP sent (demo code: 1234)');
 },
 verify:()=>{
  if(S.otp!=='1234')return fail('That OTP is wrong. Use 1234 in this demo.');
  S.user={name:S.name.trim(),phone:S.phone,points:S.user?S.user.points:50};save();
  toast('Logged in. 50 welcome points added.');go(S.after);
 },
 loginGo:()=>{S.after='profile';S.otpSent=false;S.otp='';go('login')},
 applyCoupon:()=>{
  const c=S.coupon.trim().toUpperCase();S.coupon=c;
  if(COUPONS[c]){S.couponMsg=(c==='WELCOME50'&&totals().sub<300)?'WELCOME50 needs an order of ₹300 or more.':c+' applied: '+COUPONS[c];}
  else{S.couponMsg=c?'That code is not valid.':'Enter a code first.';S.coupon=''}
  render();
 },
 copyCode:d=>{S.coupon=d.code;
  (navigator.clipboard?navigator.clipboard.writeText(d.code):Promise.reject()).then(()=>toast(d.code+' copied. Use it at checkout.')).catch(()=>toast('Use code '+d.code+' at checkout'))},
 pts:()=>{S.usePts=!S.usePts;render()},
 pay:d=>{S.pay=d.k;S.err='';render()},
 confirm:()=>{
  if(S.pay==='upi'&&!/^[\w.\-]{2,}@[a-z]{2,}$/i.test(S.upi.trim()))return fail('Enter a valid UPI ID such as name@bank.');
  const t=totals(),btn=$('#payBtn');btn.disabled=true;btn.textContent=S.pay==='salon'?'Confirming…':'Processing payment…';
  setTimeout(()=>{
    const id='GL'+String(Math.floor(10000+Math.random()*89999));
    S.bookings.push({id,items:S.cart.slice(),stylist:S.stylist,date:S.date,slot:S.slot,total:t.total,pay:S.pay,status:'Booked',name:S.user.name});
    if(t.pts)S.user.points-=t.pts;
    S.lastId=id;S.cart=[];S.slot=null;S.date=null;S.coupon='';S.couponMsg='';S.usePts=false;save();go('done');
  },1100);
 },
 cancel:d=>{const b=S.bookings.find(x=>x.id===d.id);if(b){b.status='Cancelled';save();render();toast('Booking '+b.id+' cancelled')}},
 rebook:d=>{const b=S.bookings.find(x=>x.id===d.id);if(b){S.cart=b.items.slice();S.stylist=b.stylist;S.date=null;S.slot=null;go('book');toast('Same services added. Pick a new time.')}},
 rate:d=>{S.ratings[d.id]=+d.n;render()},
 advance:d=>{const b=S.bookings.find(x=>x.id===d.id);if(!b)return;
  const i=STAGES.indexOf(b.status);if(i<STAGES.length-1){b.status=STAGES[i+1];
   if(b.status==='Completed'&&S.user){const p=Math.floor(b.total/10);S.user.points+=p;toast('Completed. Customer earned '+p+' points.')}else toast('Status: '+b.status)}
  save();render()},
 share:()=>{
  if(!S.user)return A.loginGo();
  const txt='Book at Glamoo with my code '+refCode()+' and get 20% off.';
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Referral message copied')).catch(()=>toast('Your code is '+refCode()));
 },
 logout:()=>{S.user=null;save();toast('Logged out');go('home')},
 erase:()=>{S.user=null;S.bookings=[];S.ratings={};save();toast('Your data was deleted');go('home')}
};
function fail(m){S.err=m;const y=scrollY;render();scrollTo(0,y)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(el.type==='checkbox'){A.consent({},el);return}A[el.dataset.act]&&A[el.dataset.act](el.dataset,el)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;
  if(k==='phone'){e.target.value=e.target.value.replace(/\D/g,'');}
  S[k]=e.target.value;if(k==='q')refreshList()});
render();
</script>

</body>
</html>
